# Temporary: a live test of the pull-request comment (a NO-GO push, then a fix
# that should read "Saved before merge"). Not for merge.
name: pr-comment-test

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        continue-on-error: true
        with:
          path: fixtures/clean
