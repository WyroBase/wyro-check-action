# Publishes Wyro's MCP server (npm: wyro-check) to the official MCP Registry
# as io.github.WyroBase/wyro-check. It runs here because only a GitHub Actions
# run inside the WyroBase org can prove the registry's org namespace (OIDC);
# the interactive login cannot read org roles.
#
# To publish a new version: bump mcp-registry/server.json to a wyro-check
# version already on npm (its package.json must carry the same mcpName), then
# run this workflow by hand.
name: Publish to MCP Registry
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher 1.8.9
        run: curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - name: Sign in with this run's OIDC token
        run: ./mcp-publisher login github-oidc
      - name: Publish
        working-directory: mcp-registry
        run: ../mcp-publisher publish
